[build-system]
requires=["hatchling == 1.21.1"]
build-backend = "hatchling.build"

[project]
name = "AGPS-Pyscore"
version = "1.1"
description = "AGPS後払いチャージのPythonスコアリングモデルAPI"
readme = "README.md"
requires-python = "~=3.11"
dependencies = [
    "setuptools==69.0.3",
    "wheel==0.42.0",
    "numpy==1.26.3",
    "xgboost==2.0.3",
    "fastapi[standard]==0.109.1",
    "uvicorn[standard]==0.26.0",
    "onnxruntime==1.23.2",
    "onnx==1.18.0",
    "pydantic-settings==2.2.0",
    "pydantic==2.5.2",
    "pydantic_core==2.14.5",
    "openai==0.28.1",
    "gunicorn==22.0.0",
    "anyio==4.2.0",
    "starlette==0.35.1",
    "scipy==1.13.1",
    "annotated-types==0.6.0",
    "idna==3.4",
    "sniffio==1.3.0",
    "typing_extensions==4.12.2",
    "click==8.1.7",
    "colorama==0.4.6",
    "h11==0.14.0",
    "flatbuffers==24.3.25",
    "packaging==22.0",
    "protobuf==4.25.1",
    "sympy==1.12",
    "mpmath==1.3.0",
    "python-dotenv==1.0.0",
    "httpx==0.25.0",
    "httpcore==0.18.0",
    "mdurl == 0.1.2",
    "markdown-it-py == 2.2.0",
    "rich == 13.7.1",
    "Pygments == 2.16.1",
    "python-multipart == 0.0.5",
    "shellingham == 1.5.0.post1",
    "certifi == 2023.11.17"
]

[tool.hatch.build.targets.sdist]
ignore-vcs = true
include = ["/AGPS_pyscore", "/models", "requirements.txt"]
exclude = ["/tests", "/data", "/scripts", "/wheels"]

[project.optional-dependencies]
dev = [
    "bandit==1.9.2",
    "rich==13.7.1",
    "markdown-it-py==2.2.0",
    "mdurl==0.1.2",
    "Pygments==2.16.1",
    "black==23.11.0",
    "mypy-extensions==1.0.0",
    "pathspec==0.11.0",
    "platformdirs==3.8.1",
    "mypy==1.7.1",
    "flake8==6.1.0",
    "mccabe==0.7.0",
    "pycodestype==2.11.1",
    "pyflakes==3.1.0",
    "isort==5.12.0",
]

test = [
    "pytest==7.4.2",
    "iniconfig==2.0.0",
    "pluggy==1.0.0",
    "pandas==2.2.0",
    "python-dateutil==2.8.2",
    "six==1.16.0",
    "pytz==2023.3",
    "tzdata==2022.7",
    "tqdm==4.65.0",
]